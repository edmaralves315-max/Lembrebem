name: LembreBem tests and Debug APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-and-resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: python3 scripts/verify_resources.py
      - run: npm test
        working-directory: backend
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: JVM tests, instrumented-test compilation, lint and APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:lintDebug :app:assembleDebug
      - name: Upload reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-and-lint-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/app/schemas/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload installable Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lembrebem-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
